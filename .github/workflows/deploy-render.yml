name: Deploy to Render (Runboat)

on:
  push:
    branches:
      - "16.0"
  pull_request:
    branches:
      - "16.0*"
    types: [opened, synchronize, reopened]
  workflow_dispatch:

concurrency:
  group: runboat-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  deploy:
    name: Deploy Runboat
    runs-on: ubuntu-latest
    if: github.repository_owner == 'Escodoo'
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set deploy target
        id: target
        run: |
          if [[ "${GITHUB_EVENT_NAME}" == "push" || "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            echo "mode=production" >> $GITHUB_OUTPUT
          else
            echo "mode=pr" >> $GITHUB_OUTPUT
          fi

      - name: Deploy to Render via API
        id: deploy
        run: |
          set -e
          PR_NUMBER="${{ github.event.pull_request.number }}"
          EVENT_NAME="${GITHUB_EVENT_NAME}"

          if [[ "$EVENT_NAME" == "push" || "$EVENT_NAME" == "workflow_dispatch" ]]; then
            echo "==> Triggering production deploy on Render..."
            if [ -n "${{ secrets.RENDER_SERVICE_ID }}" ]; then
              DEPLOY_INFO=$(curl -s -X POST \
                "https://api.render.com/v1/services/${{ secrets.RENDER_SERVICE_ID }}/deploys" \
                -H "Authorization: Bearer ${{ secrets.RENDER_API_KEY }}" \
                -H "Content-Type: application/json" \
                -d '{"clearCache": "do_not_clear"}')
              DEPLOY_ID=$(echo "$DEPLOY_INFO" | python3 -c "
                  import sys, json
                  data = json.load(sys.stdin)
                  print(data.get('deploy', {}).get('id', ''))
                " 2>/dev/null || echo "")
              if [ -n "$DEPLOY_ID" ]; then
                echo "==> Deploy triggered: $DEPLOY_ID"
                echo "deploy_id=$DEPLOY_ID" >> $GITHUB_OUTPUT
              fi
            fi
            echo "deploy_url=https://account-addons-runboat.onrender.com" >> $GITHUB_OUTPUT
          else
            echo "==> PR #$PR_NUMBER — triggering shared demo instance deploy..."
            if [ -n "${{ secrets.RENDER_SERVICE_ID }}" ]; then
              curl -s -X POST \
                "https://api.render.com/v1/services/${{ secrets.RENDER_SERVICE_ID }}/deploys" \
                -H "Authorization: Bearer ${{ secrets.RENDER_API_KEY }}" \
                -H "Content-Type: application/json" \
                -d '{"clearCache": "do_not_clear"}' > /dev/null
              echo "==> Deploy triggered for PR #$PR_NUMBER"
            fi
            echo "deploy_url=https://account-addons-runboat.onrender.com" >> $GITHUB_OUTPUT
          fi

      - name: Comment on PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        env:
          DEPLOY_URL: ${{ steps.deploy.outputs.deploy_url }}
          LABEL: "PR Runboat Instance"
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const url = process.env.DEPLOY_URL;
            const label = process.env.LABEL;
            const pr = context.payload.pull_request.number;
            const sha = context.payload.pull_request.head.sha.substring(0, 7);

            const body = `### ${label}\n` +
              `\nRunboat instance updated with latest changes (\`${sha}\`).` +
              `\n\n🌐 **Demo URL:** [${url}](${url})` +
              `\n\n> Free tier instances may take 30-60s to wake up on first access.`;

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: pr,
              per_page: 100,
            });
            const existing = comments.find(c =>
              c.user.type === 'Bot' && c.body.includes('Runboat instance updated')
            );
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
              console.log('Updated existing Runboat comment');
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: pr,
                body,
              });
              console.log('Created new Runboat comment');
            }
